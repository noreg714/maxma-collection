                heroTitle2: "相機的隱喻",
                heroDesc2: "人生就像一台相機：聚焦於重要的事物，捕捉美好的時光，從負片（挫折）中顯影成長；如果拍得不盡如人意，那就再試一次。",
                filterAll: "全部",
                filterMountains: "山嶽湖泊",
                filterSunsets: "落日光影",
                filterCulture: "人文古蹟",
                filterForests: "森林綠意",

            },
            sc: {
                home: "首页",
                gallery: "相片艺廊",
                heroTitle1: "感恩的心",
                heroDesc1: "是感恩带来了幸福，而不是幸福带来了感恩。将目光聚焦于生命中的丰盛。",
                heroTitle2: "相机的隐喻",
                heroDesc2: "人生就像一台相机：聚焦于重要的事物，捕捉美好的时光，从负片（挫折）中显影成长；如果拍得不尽如人意，那就再试一次。",
                filterAll: "全部",

                filterForests: "森林绿意",

            }
        };
	       function switchLanguage(lang) {
            // 切換按鈕高亮狀態
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-tc').classList.toggle('active', lang === 'tc');
            document.getElementById('btn-sc').classList.toggle('active', lang === 'sc');

            // 替換所有具備 data-key 的文字區塊
            const elements = document.querySelectorAll('[data-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    // 保留換行標籤 <br>
                    el.innerHTML = translations[lang][key].replace(/\n/g, '<br>');
                }
            });

            // 記錄使用者偏好語系
            localStorage.setItem('preferred_lang', lang);
        }

        // 頁面載入時讀取上次選擇的語言（預設為英文）
        window.onload = () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'en';
            switchLanguage(savedLang);
        };
		
	</script>
